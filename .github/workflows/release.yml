name: Release

# Publishes both crates to crates.io when a GitHub Release is published for a version
# tag such as `v0.1.0`. Drafts do not trigger it. See RELEASING.md.

on:
  release:
    types: [published]

permissions:
  contents: read

# One release at a time, and never cancel one that has started publishing.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Create this environment in the repository settings; give it required reviewers
    # to approve each release.
    environment: crates-io
    permissions:
      contents: read
      # Lets crates-io-auth-action request a short-lived token (trusted publishing).
      id-token: write
    steps:
      # Checks out the release's tag. This job never pushes, so keep no credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: "stable"

      - name: Check the tag matches the crate version and the changelog
        env:
          # Through the environment, not interpolated into the script: tag names are
          # user input.
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "authorizenet") | .version')
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Release tag $TAG does not match the crate version $version"
            exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi

      # xmllint validates serialized requests against the XSD (tests/fixtures.rs).
      - run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - run: cargo xtask codegen --check
      - run: cargo test --workspace --all-features

      # Trusted publishing only works for crates that already exist on crates.io, so
      # the first release falls back to the CARGO_REGISTRY_TOKEN secret.
      - name: Authenticate with crates.io (trusted publishing)
        id: auth
        continue-on-error: true
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      # Publishes authorizenet-derive, then authorizenet; xtask is not published.
      - run: cargo publish --workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
