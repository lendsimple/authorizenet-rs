[package]
name = "authorizenet"
description = "A typed Authorize.Net API client with async and blocking support."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
documentation = "https://docs.rs/authorizenet"
keywords = ["authorize-net", "payments", "payment-gateway", "credit-card", "api"]
categories = ["api-bindings", "web-programming::http-client"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Pinned exactly: the derives generate calls into this crate's hidden internals.
authorizenet-derive = { version = "=0.2.0", path = "../authorizenet-derive" }
bon = "3.10.2"
hmac = { version = "0.13.0", optional = true }
quick-xml = "0.42.0"
reqwest = { version = "0.13.5", default-features = false, optional = true }
rust_decimal = "1.43.0"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.151", optional = true }
sha2 = { version = "0.11.1", optional = true }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["parsing", "formatting", "macros"] }
tracing = "0.1.44"
ureq = { version = "3.4.2", optional = true, default-features = false }

[dev-dependencies]
mockito = "1.7.2"
pretty_assertions = "1.4.1"
roxmltree = "0.21.1"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = "0.3.23"
trybuild = "1.0.122"

[features]
default = ["reqwest", "rustls"]
## `ReqwestTransport`, the async `Client`'s default transport (runs on tokio).
reqwest = ["dep:reqwest"]
## `blocking::UreqTransport`, the blocking `Client`'s default transport.
ureq = ["dep:ureq"]
## TLS with rustls.
rustls = ["reqwest?/rustls", "ureq?/rustls"]
## TLS with the platform's native library.
native-tls = ["reqwest?/native-tls", "ureq?/native-tls"]
## `webhook`: verifies the `X-ANET-Signature` of webhook notifications and reads them
## as typed values.
webhooks = [
    "dep:hmac",
    "dep:sha2",
    "dep:serde",
    "dep:serde_json",
    "rust_decimal/serde",
    "time/serde",
]

[[example]]
name = "charge_credit_card"
required-features = ["reqwest"]

[[example]]
name = "charge_credit_card_blocking"
required-features = ["ureq"]

[[example]]
name = "customer_profile"
required-features = ["reqwest"]

[[example]]
name = "subscription"
required-features = ["reqwest"]

[[example]]
name = "hosted_payment_page"
required-features = ["reqwest"]
